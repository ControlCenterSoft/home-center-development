name: Home Center CodeQL

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: home-center-codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: CodeQL Python security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca
        with:
          languages: python
          queries: security-extended

      - name: Analyze Python security boundary
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca
        with:
          category: /language:python

      - name: Fail closed on new medium-or-higher CodeQL alerts
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          query = urllib.parse.urlencode(
              {
                  "state": "open",
                  "tool_name": "CodeQL",
                  "pr": pr_number,
                  "per_page": 100,
              }
          )
          url = f"https://api.github.com/repos/{repository}/code-scanning/alerts?{query}"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              alerts = json.load(response)

          blocking_levels = {"medium", "high", "critical"}
          blocking = []
          for alert in alerts:
              rule = alert.get("rule") or {}
              level = (rule.get("security_severity_level") or "").lower()
              if level in blocking_levels:
                  blocking.append(
                      (
                          alert.get("number", "unknown"),
                          level,
                          rule.get("id", "unknown-rule"),
                      )
                  )

          if blocking:
              for number, level, rule_id in blocking:
                  print(
                      f"::error title=CodeQL release gate::"
                      f"PR introduces open CodeQL alert #{number} "
                      f"({level}, {rule_id})"
                  )
              raise SystemExit(
                  "CodeQL release gate blocked: open medium-or-higher alert(s) "
                  "introduced by this pull request"
              )

          print("CodeQL release gate: no open medium-or-higher PR alerts")
          PY
