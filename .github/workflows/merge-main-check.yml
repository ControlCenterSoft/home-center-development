name: HC 0.22 main integration

on:
  push:
    branches:
      - integration/hc-022-main-sync

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Merge current main preserving qualified release conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main is already integrated"
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e

          if [[ $merge_rc -ne 0 ]]; then
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              case "$path" in
                .github/workflows/ci.yml|CERTIFICATES.md|contracts/README.md|contracts/auth/local-admin-password-change.v1.schema.json|contracts/certificates/certificate-inventory.v1.schema.json|contracts/certificates/certificate-renewal-plan.v1.schema.json|contracts/compute/compute-plan.v1.schema.json|contracts/helper/helper-policy.v1.schema.json|contracts/openapi/home-center-auth.v3.openapi.json|deploy/runtime/provision-local-admin.py|product/control-plane/src/home_center/api.py|product/control-plane/src/home_center/core/__init__.py|product/control-plane/src/home_center/core/compute_framework.py|product/control-plane/src/home_center/local_admin_auth.py|product/control-plane/src/home_center/local_admin_provision.py|product/control-plane/src/home_center/privileged_helper.py|product/control-plane/src/home_center/runtime.py|product/control-plane/src/home_center/store.py|tests/test_automation_execution.py|tests/test_node_inventory_api.py)
                  echo "Resolving qualified release path: $path"
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                *)
                  echo "Unexpected merge conflict: $path" >&2
                  exit 1
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=U | sort)
          fi

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved conflicts remain" >&2
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git rm .github/workflows/merge-main-check.yml
          git add -A
          git commit -m "HC 0.22: integrate current main deployment channel"
          git push origin HEAD:integration/hc-022-main-sync
