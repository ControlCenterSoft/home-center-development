name: Publish Home Center 0.21.0

on:
  push:
    branches:
      - publish/0.21.0

permissions:
  contents: write

jobs:
  qualify-source-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: 8a234b722329b4f852cfb43870129823796dc8eb
      RELEASE_TAG: v0.21.0
    steps:
      - name: Checkout qualified release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Requalify reproducible source artifact
        env:
          PYTHONPATH: product/control-plane/src
        run: |
          set -euo pipefail
          test "$(tr -d '\n\r' < VERSION)" = "0.21.0"
          python -m compileall -q product/control-plane/src deploy/runtime
          python -m unittest discover -s tests -p 'test_*.py'
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p dist/first dist/second
          python -m pip wheel --no-deps --wheel-dir dist/first .
          python -m pip wheel --no-deps --wheel-dir dist/second .
          python scripts/qualify_release_artifact.py --wheel-dir dist/first --compare-wheel-dir dist/second
      - name: Publish immutable source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            test "$existing" = "$TARGET_SHA"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --target "$TARGET_SHA" \
            --title "Home Center 0.21.0" \
            --notes "Qualified source release for durable home-service state and execution admission. Source CI is green; production deployment and artifact signing are separate protected gates."
