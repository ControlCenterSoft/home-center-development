name: Import verified stable runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-stable-runtime.yml"

permissions:
  contents: write

concurrency:
  group: import-stable-runtime
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Download and verify sanitized source bundle
        shell: bash
        env:
          SOURCE_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-6914-81f4-9c01-338bc3704ba1/raw?se=2026-09-08T10%3A55%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=816871da-f1cc-5e6d-b4b7-04f2499e6fc6&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-08T07%3A33%3A20Z&ske=2026-09-09T07%3A33%3A20Z&sks=b&skv=2026-02-06&sig=gPho9PUX7YVh6vZUJetZ4jG9w9nGee%2B5UZIqvsUqWIA%3D"
        run: |
          set -Eeuo pipefail
          zip="$RUNNER_TEMP/public-export.zip"
          bundle="$RUNNER_TEMP/bundle"
          source="$RUNNER_TEMP/source"
          curl --fail --location --silent --show-error "$SOURCE_URL" -o "$zip"
          echo "da756104daeae36841958de5fc285293d691d8dc8d3ddd5aaa13061275225925  $zip" | sha256sum -c -
          mkdir -p "$bundle" "$source"
          unzip -q "$zip" -d "$bundle"
          (cd "$bundle" && sha256sum -c home-center-free-source-0.9.1.tar.gz.sha256)
          tar -xzf "$bundle/home-center-free-source-0.9.1.tar.gz" -C "$source"
          (cd "$source" && python3 tools/privacy_scan.py . && sha256sum -c PUBLIC_EXPORT_MANIFEST.sha256)
          test ! -e "$source/ops"
          test ! -e "$source/.hc-dev"
      - name: Import stable runtime and generic contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          source="$RUNNER_TEMP/source"
          target="product/control-plane/src/home_center"
          mkdir -p "$target" deploy/runtime deploy/systemd contracts
          for name in \
            __main__.py action_registry.v1.json actions.py ad_auth.py api.py api_v2.py \
            auth.py backup.py external_access.py inventory.py local_admin_auth.py \
            local_admin_provision.py reconcile.py release_identity.py runtime.py server.py \
            store.py tls_status.py util.py; do
            install -m 0644 "$source/product/control-plane/src/home_center/$name" "$target/$name"
          done
          cp -a "$source/contracts/." contracts/
          rm -f contracts/deployment-profiles/deployment-profile.v1.schema.json
          cp -a "$source/deploy/runtime/." deploy/runtime/
          cp -a "$source/deploy/systemd/." deploy/systemd/
          sed -i 's#ControlCenterSoft/home-center-free#ControlCenterSoft/home-center-development#g' deploy/systemd/*
          install -m 0644 "$source/CERTIFICATES.md" CERTIFICATES.md
      - name: Replace runtime configuration with portable topology model
        shell: bash
        run: |
          cat > product/control-plane/src/home_center/config.py <<'PY'
          """Strict infrastructure-neutral runtime configuration."""
          from __future__ import annotations
          import ipaddress, json, os, re
          from dataclasses import dataclass, field
          from pathlib import Path
          from typing import Any
          from .ad_auth import AdAuthConfig
          from .external_access import normalize_public_hostname, normalize_trusted_proxy_addresses
          from .util import secure_file

          CONFIG_SCHEMAS = frozenset({"home-center.config.v4", "home-center.config.v5"})
          IDENTIFIER = re.compile(r"^[a-z][a-z0-9._:-]{1,127}$", re.I)

          @dataclass(frozen=True, slots=True)
          class Peer:
              node_id: str
              name: str
              address: str
              url: str
              certificate_name: str

          @dataclass(frozen=True, slots=True)
          class ExternalAccessConfig:
              enabled: bool = False
              mode: str = "trusted-reverse-proxy"
              public_hostname: str | None = None
              trusted_proxy_addresses: tuple[str, ...] = ()

          @dataclass(frozen=True, slots=True)
          class Config:
              cluster_id: str
              node_id: str
              node_name: str
              role: str
              management_address: str
              web_port: int
              peer_port: int
              state_db: Path
              backup_dir: Path
              web_root: Path
              local_admin_credentials_file: Path
              session_key_file: Path
              audit_key_file: Path
              tls_certificate: Path
              tls_private_key: Path
              cluster_ca: Path
              web_ca: Path
              deployment_profile: Path
              peers: tuple[Peer, ...]
              reconcile_interval_seconds: int
              peer_timeout_seconds: int
              ad_auth: AdAuthConfig = field(default_factory=AdAuthConfig.disabled)
              external_access: ExternalAccessConfig = field(default_factory=ExternalAccessConfig)

              @property
              def web_bind(self) -> tuple[str, int]:
                  return self.management_address, self.web_port

              @property
              def peer_bind(self) -> tuple[str, int]:
                  return self.management_address, self.peer_port

          def _required(raw: dict[str, Any], name: str, expected: type) -> Any:
              value = raw.get(name)
              if not isinstance(value, expected) or (expected is str and not value.strip()):
                  raise ValueError(f"invalid or missing config field: {name}")
              return value

          def _path(raw: dict[str, Any], name: str) -> Path:
              value = Path(_required(raw, name, str))
              if not value.is_absolute():
                  raise ValueError(f"config path must be absolute: {name}")
              return value

          def _ad_auth(raw: dict[str, Any]) -> AdAuthConfig:
              value = _required(raw, "ad_auth", dict)
              required = {"enabled", "realm", "kdc_hosts", "allowed_admin_groups", "timeout_seconds", "cache_root"}
              if set(value) != required:
                  raise ValueError("ad_auth config shape rejected")
              enabled = value.get("enabled")
              if not isinstance(enabled, bool):
                  raise ValueError("ad_auth enabled must be boolean")
              realm = _required(value, "realm", str).upper()
              if re.fullmatch(r"[A-Z0-9][A-Z0-9.-]{2,254}", realm) is None:
                  raise ValueError("ad_auth realm rejected")
              hosts = value.get("kdc_hosts")
              if not isinstance(hosts, list) or not 1 <= len(hosts) <= 16 or any(not isinstance(item, str) for item in hosts):
                  raise ValueError("ad_auth kdc_hosts rejected")
              normalized_hosts = tuple(item.lower() for item in hosts)
              realm_suffix = "." + realm.lower()
              if any(re.fullmatch(r"[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?", item) is None or not item.endswith(realm_suffix) for item in normalized_hosts):
                  raise ValueError("ad_auth kdc_hosts rejected")
              groups = value.get("allowed_admin_groups")
              if not isinstance(groups, list) or not 1 <= len(groups) <= 64 or any(not isinstance(item, str) or item != item.strip() or not 1 <= len(item) <= 128 for item in groups):
                  raise ValueError("ad_auth allowed_admin_groups rejected")
              timeout = value.get("timeout_seconds")
              if isinstance(timeout, bool) or not isinstance(timeout, int) or not 1 <= timeout <= 10:
                  raise ValueError("ad_auth timeout rejected")
              cache_root = Path(_required(value, "cache_root", str))
              if not cache_root.is_absolute():
                  raise ValueError("ad_auth cache_root must be absolute")
              return AdAuthConfig(enabled=enabled, realm=realm, kdc_hosts=normalized_hosts, allowed_admin_groups=tuple(groups), timeout_seconds=timeout, cache_root=cache_root)

          def _external_access(raw: dict[str, Any]) -> ExternalAccessConfig:
              value = _required(raw, "external_access", dict)
              required = {"enabled", "mode", "public_hostname", "trusted_proxy_addresses"}
              if set(value) != required:
                  raise ValueError("external_access config shape rejected")
              enabled = value.get("enabled")
              if type(enabled) is not bool or value.get("mode") != "trusted-reverse-proxy":
                  raise ValueError("external_access config rejected")
              hostname_value = value.get("public_hostname")
              if hostname_value is not None and not isinstance(hostname_value, str):
                  raise ValueError("external_access public_hostname rejected")
              hostname = normalize_public_hostname(hostname_value) if hostname_value is not None else None
              proxies_value = value.get("trusted_proxy_addresses")
              if not isinstance(proxies_value, list):
                  raise ValueError("external_access trusted_proxy_addresses rejected")
              proxies = normalize_trusted_proxy_addresses(proxies_value)
              if enabled and (hostname is None or not proxies):
                  raise ValueError("enabled external_access requires public hostname and trusted proxy")
              return ExternalAccessConfig(enabled=enabled, public_hostname=hostname, trusted_proxy_addresses=proxies)

          def _peer(raw: dict[str, Any], peer_port: int) -> Peer:
              node_id = _required(raw, "node_id", str)
              name = _required(raw, "name", str)
              if IDENTIFIER.fullmatch(node_id) is None or IDENTIFIER.fullmatch(name) is None:
                  raise ValueError("peer identity rejected")
              address = _required(raw, "address", str)
              parsed = ipaddress.ip_address(address)
              if parsed.is_unspecified or parsed.is_loopback or parsed.is_multicast:
                  raise ValueError("peer address rejected")
              url = _required(raw, "url", str)
              if url != f"https://{address}:{peer_port}":
                  raise ValueError("peer URL must match peer address and configured peer port")
              certificate_name = _required(raw, "certificate_name", str)
              if not 1 <= len(certificate_name) <= 253:
                  raise ValueError("peer certificate name rejected")
              return Peer(node_id, name, address, url, certificate_name)

          def load_config(path: str | Path | None = None) -> Config:
              config_path = Path(path or os.environ.get("HOME_CENTER_CONFIG", "/etc/home-center/config.json"))
              with config_path.open("r", encoding="utf-8") as stream:
                  raw = json.load(stream)
              if not isinstance(raw, dict) or raw.get("schema") not in CONFIG_SCHEMAS:
                  raise ValueError(f"unsupported config schema in {config_path}")
              if config_path.stat().st_mode & 0o002:
                  raise PermissionError(f"world-writable config rejected: {config_path}")
              role = _required(raw, "role", str)
              if IDENTIFIER.fullmatch(role) is None:
                  raise ValueError("role rejected")
              address = _required(raw, "management_address", str)
              parsed_address = ipaddress.ip_address(address)
              if parsed_address.is_unspecified or parsed_address.is_loopback or parsed_address.is_multicast:
                  raise ValueError("management_address must be a concrete address")
              ports = (int(raw.get("web_port", 8443)), int(raw.get("peer_port", 9443)))
              if any(port < 1024 or port > 65535 for port in ports) or ports[0] == ports[1]:
                  raise ValueError("web/peer ports must be distinct unprivileged ports")
              peers_raw = raw.get("peers")
              if peers_raw is None and "peer" in raw:
                  peers_raw = [raw["peer"]]
              if peers_raw is None:
                  peers_raw = []
              if not isinstance(peers_raw, list) or len(peers_raw) > 63 or any(not isinstance(item, dict) for item in peers_raw):
                  raise ValueError("peers config rejected")
              peers = tuple(_peer(item, ports[1]) for item in peers_raw)
              peer_ids = [item.node_id for item in peers]
              peer_names = [item.name.casefold() for item in peers]
              if len(peer_ids) != len(set(peer_ids)) or len(peer_names) != len(set(peer_names)):
                  raise ValueError("duplicate peer identity")
              cfg = Config(
                  cluster_id=_required(raw, "cluster_id", str), node_id=_required(raw, "node_id", str), node_name=_required(raw, "node_name", str), role=role,
                  management_address=address, web_port=ports[0], peer_port=ports[1], state_db=_path(raw, "state_db"), backup_dir=_path(raw, "backup_dir"), web_root=_path(raw, "web_root"),
                  local_admin_credentials_file=_path(raw, "local_admin_credentials_file"), session_key_file=_path(raw, "session_key_file"), audit_key_file=_path(raw, "audit_key_file"),
                  tls_certificate=_path(raw, "tls_certificate"), tls_private_key=_path(raw, "tls_private_key"), cluster_ca=_path(raw, "cluster_ca"), web_ca=_path(raw, "web_ca"),
                  deployment_profile=_path(raw, "deployment_profile"), peers=peers, reconcile_interval_seconds=max(5, min(int(raw.get("reconcile_interval_seconds", 15)), 300)),
                  peer_timeout_seconds=max(1, min(int(raw.get("peer_timeout_seconds", 3)), 15)), ad_auth=_ad_auth(raw), external_access=_external_access(raw),
              )
              if IDENTIFIER.fullmatch(cfg.node_id) is None or IDENTIFIER.fullmatch(cfg.node_name) is None:
                  raise ValueError("local node identity rejected")
              if any(peer.node_id == cfg.node_id or peer.name.casefold() == cfg.node_name.casefold() for peer in cfg.peers):
                  raise ValueError("peer identity must differ from local node identity")
              if cfg.web_ca.resolve() == cfg.cluster_ca.resolve():
                  raise ValueError("web_ca must be independent from cluster_ca")
              for secret in (cfg.local_admin_credentials_file, cfg.session_key_file, cfg.audit_key_file, cfg.tls_private_key):
                  secure_file(secret, allow_group_read=True)
              for public_file in (cfg.tls_certificate, cfg.cluster_ca, cfg.web_ca, cfg.deployment_profile):
                  if not public_file.is_file():
                      raise FileNotFoundError(public_file)
              if not cfg.web_root.is_dir():
                  raise FileNotFoundError(cfg.web_root)
              return cfg
          PY
      - name: Generalize runtime and peer reconciliation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          runtime = Path("product/control-plane/src/home_center/runtime.py")
          text = runtime.read_text(encoding="utf-8")
          text = text.replace('ready_nodes = sum(node["status"] == "ready" for node in nodes)\n        status = "healthy" if ready_nodes == 2 and len(nodes) == 2 else "degraded"', 'expected_nodes = len(self.profile["spec"]["nodes"])\n        ready_nodes = sum(node["status"] == "ready" for node in nodes)\n        status = "healthy" if ready_nodes == expected_nodes and len(nodes) == expected_nodes else "degraded"')
          text = text.replace('"expected_nodes": 2,', '"expected_nodes": expected_nodes,')
          text = text.replace('if value.get("schema") != "home-center.deployment-profile.v1":\n            raise ValueError("unsupported deployment profile")', 'if value.get("schema") not in {"home-center.deployment-profile.v1", "home-center.deployment-profile.v2"}:\n            raise ValueError("unsupported deployment profile")')
          text = text.replace('if not isinstance(nodes, list) or len(nodes) != 2:\n            raise ValueError("deployment profile must contain exactly two nodes")', 'if not isinstance(nodes, list) or not 1 <= len(nodes) <= 64:\n            raise ValueError("deployment profile node count must be between 1 and 64")')
          runtime.write_text(text, encoding="utf-8")

          api = Path("product/control-plane/src/home_center/api.py")
          text = api.read_text(encoding="utf-8")
          old = 'return subjects.get("commonName") == self.runtime.config.peer.certificate_name'
          new = 'common_name = subjects.get("commonName")\n        return any(common_name == peer.certificate_name for peer in self.runtime.config.peers)'
          if old not in text:
              raise SystemExit("API_PEER_IDENTITY_MARKER_MISSING")
          api.write_text(text.replace(old, new), encoding="utf-8")
          PY
          cat > product/control-plane/src/home_center/reconcile.py <<'PY'
          """Read-only node reconciliation for an arbitrary configured peer set."""
          from __future__ import annotations
          import json, logging, ssl, threading, urllib.error, urllib.request
          from typing import Any
          from .config import Config, Peer
          from .inventory import collect
          from .store import StateStore

          LOG = logging.getLogger("home_center.reconcile")

          class Reconciler:
              def __init__(self, config: Config, store: StateStore) -> None:
                  self.config = config
                  self.store = store
                  self._stop = threading.Event()
                  self._thread = threading.Thread(target=self._run, name="home-center-reconcile", daemon=True)
                  self._latest_local: dict[str, Any] = {}
                  self._lock = threading.Lock()
                  self._peer_states = {peer.node_id: "unknown" for peer in config.peers}

              def start(self) -> None:
                  self.reconcile_once(); self._thread.start()

              def stop(self) -> None:
                  self._stop.set(); self._thread.join(timeout=5)

              def local_capability(self) -> dict[str, Any]:
                  with self._lock:
                      return json.loads(json.dumps(self._latest_local))

              def _run(self) -> None:
                  while not self._stop.wait(self.config.reconcile_interval_seconds):
                      try: self.reconcile_once()
                      except Exception: LOG.exception("reconcile iteration failed")

              def reconcile_once(self) -> None:
                  local = collect(self.config.node_id, self.config.node_name, self.config.role, self.config.management_address)
                  with self._lock: self._latest_local = local
                  self.store.upsert_node(local, "ready")
                  for peer in self.config.peers:
                      try:
                          capability = self._fetch_peer(peer)
                          self._validate_peer(peer, capability)
                          self.store.upsert_node(capability, "ready")
                          self._transition_peer(peer, "ready", None)
                      except Exception as exc:
                          self.store.mark_node(peer.node_id, "unreachable")
                          self._transition_peer(peer, "unreachable", self._failure_class(exc))

              def _fetch_peer(self, peer: Peer) -> dict[str, Any]:
                  context = ssl.create_default_context(cafile=str(self.config.cluster_ca))
                  context.minimum_version = ssl.TLSVersion.TLSv1_3
                  context.load_cert_chain(str(self.config.tls_certificate), str(self.config.tls_private_key))
                  request = urllib.request.Request(f"{peer.url}/internal/v1/node", headers={"Accept": "application/json", "User-Agent": "home-center-peer/1"})
                  with urllib.request.urlopen(request, timeout=self.config.peer_timeout_seconds, context=context) as response:
                      if response.status != 200 or response.headers.get_content_type() != "application/json":
                          raise RuntimeError("peer response rejected")
                      body = response.read(256 * 1024 + 1)
                      if len(body) > 256 * 1024: raise RuntimeError("peer response is too large")
                  envelope = json.loads(body)
                  if envelope.get("schema") != "home-center.peer-node.v1" or envelope.get("cluster_id") != self.config.cluster_id:
                      raise ValueError("peer envelope rejected")
                  capability = envelope.get("capability")
                  if not isinstance(capability, dict): raise ValueError("missing peer capability")
                  return capability

              @staticmethod
              def _validate_peer(peer: Peer, capability: dict[str, Any]) -> None:
                  if capability.get("schema") != "home-center.node-capability.v1": raise ValueError("unsupported capability schema")
                  node = capability.get("node")
                  if not isinstance(node, dict): raise ValueError("missing node identity")
                  expected = {"id": peer.node_id, "name": peer.name, "address": peer.address}
                  if any(node.get(key) != value for key, value in expected.items()): raise ValueError("peer identity mismatch")

              def _transition_peer(self, peer: Peer, state: str, reason: str | None) -> None:
                  old = self._peer_states.get(peer.node_id, "unknown")
                  if state == old: return
                  self._peer_states[peer.node_id] = state
                  self.store.audit(actor="system:reconciler", action="peer.health.transition", target=peer.node_id, outcome=state, correlation_id=f"peer-{peer.node_id}", details={"from": old, "to": state, "reason_class": reason})

              @staticmethod
              def _failure_class(exc: Exception) -> str:
                  if isinstance(exc, urllib.error.HTTPError): return f"http_{exc.code}"
                  if isinstance(exc, urllib.error.URLError):
                      reason = exc.reason
                      if isinstance(reason, ssl.SSLCertVerificationError): return f"tls_verify_{reason.verify_code}"
                      if isinstance(reason, ssl.SSLError): return "tls_handshake"
                      if isinstance(reason, OSError) and reason.errno is not None: return f"transport_errno_{reason.errno}"
                      return f"transport_{type(reason).__name__}"
                  if isinstance(exc, json.JSONDecodeError): return "peer_json_invalid"
                  return type(exc).__name__
          PY
      - name: Verify imported source and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q product/control-plane/src/home_center deploy/runtime
          PYTHONPATH=product/control-plane/src python3 - <<'PY'
          import home_center.actions
          import home_center.api
          import home_center.api_v2
          import home_center.auth
          import home_center.backup
          import home_center.config
          import home_center.external_access
          import home_center.inventory
          import home_center.reconcile
          import home_center.runtime
          import home_center.server
          import home_center.store
          import home_center.tls_status
          PY
          python3 - <<'PY'
          from pathlib import Path
          forbidden = ("dc01", "dc02", "HM.DM", "hm.dm")
          roots = [Path("product"), Path("contracts"), Path("deploy")]
          for root in roots:
              for path in root.rglob("*"):
                  if not path.is_file(): continue
                  try: text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError: continue
                  for marker in forbidden:
                      if marker in text: raise SystemExit(f"FORBIDDEN_MARKER {path} {marker}")
          print("STABLE_RUNTIME_NEUTRALITY=PASS")
          PY
          git rm .github/workflows/import-stable-runtime.yml
          git config user.name "ControlCenterSoft"
          git config user.email "40738562+ControlCenterSoft@users.noreply.github.com"
          git add -A
          git commit -m "migration: restore verified portable stable runtime"
          git push origin HEAD:main
