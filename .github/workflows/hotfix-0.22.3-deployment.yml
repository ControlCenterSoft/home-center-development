name: Promote Home Center 0.22.3 deployment hotfix

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: home-center-hotfix-v0.22.3
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact hotfix tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: v0.22.3
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: ""

      - name: Verify immutable release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$(tr -d '[:space:]' < VERSION)" == "0.22.3" ]]
          [[ "$(git describe --tags --exact-match HEAD)" == "v0.22.3" ]]
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.22.3" --jq '.draft == false and .prerelease == false' | grep -Fx true
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]

      - name: Build deployment artifact from clean tag
        shell: bash
        env:
          HOME_CENTER_RELEASE_BUILD: "1"
        run: |
          set -Eeuo pipefail
          bash deploy/scripts/build-deployment-artifact.sh "$RUNNER_TEMP/deployment-dist"

      - name: Re-run qualification after artifact build
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q product/control-plane/src deploy/runtime
          PYTHONPATH=product/control-plane/src python -m unittest discover -s tests -p 'test_*.py' -v
          for script in deploy/scripts/*.sh; do bash -n "$script"; done

      - name: Validate and publish immutable deployment assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          artifact="$RUNNER_TEMP/deployment-dist/home-center-0.22.3-linux-amd64.tar.gz"
          sidecar="$artifact.sha256"
          [[ -f "$artifact" && -f "$sidecar" ]]
          (cd "$RUNNER_TEMP/deployment-dist" && sha256sum -c "$(basename "$sidecar")")
          members=$(tar -tzf "$artifact")
          for entry in ./DEPLOYMENT-ARTIFACT.json ./VERSION ./REVISION ./MANIFEST.sha256 ./web/index.html ./web/app.css ./web/app.js ./deploy/install-node.sh ./deploy/install-node-core.sh ./deploy/bootstrap-two-node.sh ./deploy/rollback-node.sh; do
            grep -Fxq "$entry" <<<"$members" || { echo "missing required entry: $entry" >&2; exit 66; }
          done
          existing=$(gh release view v0.22.3 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if grep -Fxq 'home-center-0.22.3-linux-amd64.tar.gz' <<<"$existing" || grep -Fxq 'home-center-0.22.3-linux-amd64.tar.gz.sha256' <<<"$existing"; then
            echo 'deployment artifact already exists; refusing replacement' >&2
            exit 66
          fi
          gh release upload v0.22.3 "$artifact" "$sidecar" --repo "$GITHUB_REPOSITORY"
