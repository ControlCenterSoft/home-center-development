name: HC 0.22 main compatibility layer

on:
  push:
    branches:
      - fix/hc-022-main-compat

permissions:
  contents: write

jobs:
  integrate-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout compatibility branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Restore compatible main API surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main

          git checkout origin/main -- \
            product/control-plane/src/home_center/core/compute_framework.py \
            product/control-plane/src/home_center/local_admin_auth.py \
            product/control-plane/src/home_center/local_admin_provision.py

          cat > product/control-plane/src/home_center/core/__init__.py <<'PYFILE'
          """Infrastructure-neutral Home Center core planning foundation."""

          from .certificate_lifecycle import (
              CertificateLifecycleError,
              CertificateLifecyclePlanner,
              CertificatePlanState,
              CertificateRecord,
              CertificateRenewalPlan,
              CertificateStatus,
              classify_certificate,
          )
          from .compute_framework import (
              ComputeCapacity,
              ComputeCapacityPlan,
              ComputeCapacityPlanningRequest,
              ComputeCapacitySnapshot,
              ComputeFrameworkError,
              ComputePlan,
              ComputePlanner,
              ComputePlanState,
              ComputeProviderDescriptor,
              ComputeProviderKind,
              ComputeProviderProfile,
              ComputeProviderState,
              ComputeResourceKind,
              ComputeResourceRequest,
              proxmox_compute_profile,
          )
          from .home_lab import HomeLabPlan, HomeLabPlanner, HomeLabQuota, HomeLabTemplate, HomeLabUsage
          from .lxc_lifecycle import (
              LxcAction,
              LxcLifecycleError,
              LxcLifecyclePlan,
              LxcLifecyclePlanner,
              LxcLifecycleRequest,
              LxcSnapshot,
              LxcState,
          )
          from .node_manager import NodeDescriptor, NodeManager, NodeState, NodeTransitionPlan
          from .proxmox_provider import (
              AuthState as ProxmoxAuthState,
              Health as ProxmoxHealth,
              Node as ProxmoxNode,
              NodeState as ProxmoxNodeState,
              ProxmoxDiscovery,
              ProxmoxProviderError,
              Resource as ProxmoxResource,
              ResourceState as ProxmoxResourceState,
              normalize_proxmox_discovery,
          )
          from .resource_scheduler import (
              PlacementPlan,
              PlacementRequest,
              ProviderCapacity,
              ResourceScheduler,
              ResourceSchedulerError,
          )
          from .vm_lifecycle import (
              VmAction,
              VmLifecycleError,
              VmLifecyclePlan,
              VmLifecyclePlanner,
              VmLifecycleRequest,
              VmSnapshot,
              VmState,
          )

          __all__ = [
              "CertificateLifecycleError",
              "CertificateLifecyclePlanner",
              "CertificatePlanState",
              "CertificateRecord",
              "CertificateRenewalPlan",
              "CertificateStatus",
              "classify_certificate",
              "ComputeCapacity",
              "ComputeCapacityPlan",
              "ComputeCapacityPlanningRequest",
              "ComputeCapacitySnapshot",
              "ComputeFrameworkError",
              "ComputePlan",
              "ComputePlanner",
              "ComputePlanState",
              "ComputeProviderDescriptor",
              "ComputeProviderKind",
              "ComputeProviderProfile",
              "ComputeProviderState",
              "ComputeResourceKind",
              "ComputeResourceRequest",
              "proxmox_compute_profile",
              "HomeLabPlan",
              "HomeLabPlanner",
              "HomeLabQuota",
              "HomeLabTemplate",
              "HomeLabUsage",
              "LxcAction",
              "LxcLifecycleError",
              "LxcLifecyclePlan",
              "LxcLifecyclePlanner",
              "LxcLifecycleRequest",
              "LxcSnapshot",
              "LxcState",
              "NodeDescriptor",
              "NodeManager",
              "NodeState",
              "NodeTransitionPlan",
              "PlacementPlan",
              "PlacementRequest",
              "ProviderCapacity",
              "ProxmoxAuthState",
              "ProxmoxDiscovery",
              "ProxmoxHealth",
              "ProxmoxNode",
              "ProxmoxNodeState",
              "ProxmoxProviderError",
              "ProxmoxResource",
              "ProxmoxResourceState",
              "ResourceScheduler",
              "ResourceSchedulerError",
              "VmAction",
              "VmLifecycleError",
              "VmLifecyclePlan",
              "VmLifecyclePlanner",
              "VmLifecycleRequest",
              "VmSnapshot",
              "VmState",
              "normalize_proxmox_discovery",
          ]
          PYFILE

          sed -i 's/^          //' product/control-plane/src/home_center/core/__init__.py
          git rm .github/workflows/hc-022-main-compat.yml
          git add -A
          git commit -m "HC 0.22: restore main auth and compute compatibility"
          git push origin HEAD:fix/hc-022-main-compat
