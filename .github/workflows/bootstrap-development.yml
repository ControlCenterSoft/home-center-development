name: Bootstrap development source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-development.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-home-center-development
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Import infrastructure-neutral public source
        shell: bash
        run: |
          set -Eeuo pipefail
          source="$RUNNER_TEMP/source"
          auth_header="$(git config --local --get http.https://github.com/.extraheader || true)"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git clone --depth 1 https://github.com/ControlCenterSoft/home-center-free.git "$source"
          if test -n "$auth_header"; then
            git config --local http.https://github.com/.extraheader "$auth_header"
          fi
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows' \
            "$source/" ./
          rm -f PUBLIC_SOURCE.json PUBLIC_EXPORT_MANIFEST.sha256 PUBLIC_EXPORT_POLICY.md RELEASES.json
      - name: Commit imported source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "ControlCenterSoft"
          git config user.email "40738562+ControlCenterSoft@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "migration: import infrastructure-neutral Home Center baseline"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
