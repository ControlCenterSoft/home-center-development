name: Bootstrap development source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-development.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-home-center-development
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Import infrastructure-neutral public source
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/source.tar.gz"
          source="$RUNNER_TEMP/source"
          curl --fail --location --silent --show-error \
            "https://codeload.github.com/ControlCenterSoft/home-center-free/tar.gz/refs/heads/main" \
            -o "$archive"
          mkdir -p "$source"
          tar -xzf "$archive" -C "$source" --strip-components=1
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows' \
            "$source/" ./
          rm -f PUBLIC_SOURCE.json PUBLIC_EXPORT_MANIFEST.sha256 PUBLIC_EXPORT_POLICY.md RELEASES.json
      - name: Commit imported source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "ControlCenterSoft"
          git config user.email "40738562+ControlCenterSoft@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "migration: import infrastructure-neutral Home Center baseline"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
