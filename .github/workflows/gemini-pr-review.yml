name: Gemini PR Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve exact pull request identity
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          pr_number="${EVENT_PR_NUMBER:-${INPUT_PR_NUMBER:-}}"
          if [[ ! "${pr_number}" =~ ^[0-9]+$ ]]; then
            echo '::error title=Gemini identity::A valid pull request number is required.'
            exit 1
          fi

          pr_json="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pulls/${pr_number}")"

          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          base_sha="$(jq -r '.base.sha' <<<"${pr_json}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
          state="$(jq -r '.state' <<<"${pr_json}")"
          draft="$(jq -r '.draft' <<<"${pr_json}")"

          if [[ "${head_repo}" != "${REPOSITORY}" ]]; then
            echo '::error title=Gemini identity::Fork pull requests are not eligible for the secret-backed review gate.'
            exit 1
          fi
          if [[ "${state}" != "open" || "${draft}" != "false" ]]; then
            echo '::error title=Gemini identity::The pull request must be open and ready for review.'
            exit 1
          fi
          if [[ ! "${head_sha}" =~ ^[0-9a-f]{40}$ || ! "${base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error title=Gemini identity::GitHub returned an invalid head/base SHA.'
            exit 1
          fi

          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact head and base
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ steps.identity.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare immutable local review evidence
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.identity.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ steps.identity.outputs.base_sha }}
        run: |
          set -euo pipefail

          actual_head="$(git rev-parse HEAD)"
          git cat-file -e "${EXPECTED_BASE_SHA}^{commit}"
          if [[ "${actual_head}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo '::error title=Gemini identity::Checked-out HEAD does not match the expected exact head SHA.'
            exit 1
          fi

          mkdir -p .gemini review-evidence
          if [[ -f GEMINI.md ]]; then
            mv GEMINI.md "${RUNNER_TEMP}/GEMINI.md.project"
          fi

          cat > review-evidence/identity.txt <<EOF
          head_sha=${EXPECTED_HEAD_SHA}
          base_sha=${EXPECTED_BASE_SHA}
          EOF
          git diff --no-ext-diff --find-renames --find-copies --stat "${EXPECTED_BASE_SHA}...${EXPECTED_HEAD_SHA}" > review-evidence/diff.stat
          git diff --no-ext-diff --find-renames --find-copies --name-status "${EXPECTED_BASE_SHA}...${EXPECTED_HEAD_SHA}" > review-evidence/files.txt
          git diff --no-ext-diff --find-renames --find-copies --unified=80 "${EXPECTED_BASE_SHA}...${EXPECTED_HEAD_SHA}" > review-evidence/diff.patch

          cat > .gemini/settings.json <<'EOF'
          {
            "model": {
              "maxSessionTurns": 32
            },
            "telemetry": {
              "enabled": false
            },
            "tools": {
              "core": [
                "list_directory",
                "read_file",
                "glob",
                "grep_search"
              ]
            }
          }
          EOF

      - name: Install Gemini CLI
        shell: bash
        env:
          GEMINI_CLI_VERSION: ${{ vars.GEMINI_CLI_VERSION }}
        run: |
          set -euo pipefail
          version="${GEMINI_CLI_VERSION:-0.59.0}"
          npm install --silent --no-audit --prefer-offline --global "@google/gemini-cli@${version}"
          gemini --version

      - name: Run and validate Gemini exact-SHA review
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          EXPECTED_HEAD_SHA: ${{ steps.identity.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ steps.identity.outputs.base_sha }}
        run: |
          set -euo pipefail

          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo '::error title=Gemini review UNKNOWN/BLOCK::GEMINI_API_KEY is not configured for this repository.'
            exit 1
          fi

          prompt="$(cat <<EOF
          Perform an independent Home Center release-candidate review using only the checked-out local repository and the read-only local tools available to you.

          Exact identity:
          head_sha=${EXPECTED_HEAD_SHA}
          base_sha=${EXPECTED_BASE_SHA}

          Start by reading review-evidence/identity.txt, review-evidence/diff.stat, review-evidence/files.txt and review-evidence/diff.patch. These files were generated from the exact checked-out Git history before your review. Read additional repository files only when needed to assess that diff. Do not inspect .git or parent directories. Do not use network, GitHub, MCP, account, issue, approval, repository-mutation or file-write tools. Do not request or expose secrets or PII.

          Assess correctness, regressions, security/privacy, infrastructure neutrality, tests, migration/upgrade implications, and release-note consistency. Deterministic CI is a separate authority; do not claim it passed unless that is evident in repository artifacts. Return BLOCK for any release-blocking finding; otherwise PASS.

          Return ONLY this compact JSON object with exactly these keys and no markdown fences or extra text:
          {\"verdict\":\"PASS|BLOCK\",\"head_sha\":\"${EXPECTED_HEAD_SHA}\",\"base_sha\":\"${EXPECTED_BASE_SHA}\",\"findings\":[\"concise finding\"]}
          EOF
          )"

          stdout_file="$(mktemp)"
          stderr_file="$(mktemp)"
          trap 'rm -f "${stdout_file}" "${stderr_file}"' EXIT

          if ! gemini --model gemini-3.8-flash --yolo --prompt "${prompt}" --output-format json >"${stdout_file}" 2>"${stderr_file}"; then
            echo '::error title=Gemini review UNKNOWN/BLOCK::Gemini CLI/provider execution failed.'
            safe_error="$(sed -E 's/(key|token|secret|password)=[^[:space:]]+/\1=[REDACTED]/Ig' "${stderr_file}" | head -c 2000)"
            printf '%s\n' "${safe_error}"
            printf '%s\n' "${safe_error}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          if ! jq -e 'type == "object"' "${stdout_file}" >/dev/null 2>&1; then
            echo '::error title=Gemini review UNKNOWN/BLOCK::Gemini CLI returned malformed JSON output.'
            exit 1
          fi

          response="$(jq -r '.response // empty' "${stdout_file}")"
          response="$(printf '%s' "${response}" | sed -e '1{/^```json$/d;}' -e '1{/^```$/d;}' -e '${/^```$/d;}')"
          if [[ -z "${response}" ]]; then
            echo '::error title=Gemini review UNKNOWN/BLOCK::Gemini returned no final review response.'
            exit 1
          fi

          if ! jq -e '
            type == "object" and
            (keys | sort) == ["base_sha","findings","head_sha","verdict"] and
            (.verdict == "PASS" or .verdict == "BLOCK") and
            (.head_sha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.base_sha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.findings | type == "array" and length <= 20) and
            all(.findings[]; type == "string" and length <= 500) and
            ((.verdict == "PASS") or (.findings | length >= 1))
          ' <<<"${response}" >/dev/null; then
            echo '::error title=Gemini review UNKNOWN/BLOCK::Gemini returned an ambiguous or schema-invalid verdict.'
            exit 1
          fi

          verdict="$(jq -r '.verdict' <<<"${response}")"
          head_sha="$(jq -r '.head_sha' <<<"${response}")"
          base_sha="$(jq -r '.base_sha' <<<"${response}")"

          if [[ "${head_sha}" != "${EXPECTED_HEAD_SHA}" || "${base_sha}" != "${EXPECTED_BASE_SHA}" ]]; then
            echo '::error title=Gemini review UNKNOWN/BLOCK::Gemini evidence does not match the exact current head/base SHA.'
            exit 1
          fi

          validated_response="$(jq -c '{verdict,head_sha,base_sha,findings}' <<<"${response}")"
          printf 'Gemini validated exact-SHA review: %s\n' "${validated_response}"

          {
            echo '### Gemini exact-SHA verdict'
            echo "- verdict: **${verdict}**"
            echo "- head: \`${head_sha}\`"
            echo "- base: \`${base_sha}\`"
            echo '- findings:'
            jq -r '.findings[] | "  - " + .' <<<"${response}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${verdict}" != "PASS" ]]; then
            echo '::error title=Gemini review BLOCK::Gemini reported a release-blocking finding.'
            exit 1
          fi
