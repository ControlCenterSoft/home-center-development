name: Gemini PR Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve exact pull request identity
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          pr_number="${EVENT_PR_NUMBER:-${INPUT_PR_NUMBER:-}}"
          if [[ ! "${pr_number}" =~ ^[0-9]+$ ]]; then
            echo '::error title=Gemini identity::A valid pull request number is required.'
            exit 1
          fi

          pr_json="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pulls/${pr_number}")"

          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          base_sha="$(jq -r '.base.sha' <<<"${pr_json}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
          state="$(jq -r '.state' <<<"${pr_json}")"
          draft="$(jq -r '.draft' <<<"${pr_json}")"

          if [[ "${head_repo}" != "${REPOSITORY}" ]]; then
            echo '::error title=Gemini identity::Fork pull requests are not eligible for the secret-backed review gate.'
            exit 1
          fi
          if [[ "${state}" != "open" || "${draft}" != "false" ]]; then
            echo '::error title=Gemini identity::The pull request must be open and ready for review.'
            exit 1
          fi
          if [[ ! "${head_sha}" =~ ^[0-9a-f]{40}$ || ! "${base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error title=Gemini identity::GitHub returned an invalid head/base SHA.'
            exit 1
          fi

          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
          {
            echo '### Gemini review identity'
            echo "- PR: #${pr_number}"
            echo "- head: \`${head_sha}\`"
            echo "- base: \`${base_sha}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout exact head
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ steps.identity.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gemini exact-SHA review
        id: gemini_review
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: ${{ vars.GEMINI_CLI_VERSION }}
          gemini_model: gemini-3.8-flash
          gemini_debug: ${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}
          workflow_name: home-center-gemini-review
          github_pr_number: ${{ steps.identity.outputs.pr_number }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 16
              },
              "telemetry": {
                "enabled": false
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "pull_request_read"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": []
              }
            }
          prompt: |-
            Review Home Center pull request #${{ steps.identity.outputs.pr_number }} as an independent release-candidate reviewer.
            The exact identity that MUST be reviewed is:
            head_sha=${{ steps.identity.outputs.head_sha }}
            base_sha=${{ steps.identity.outputs.base_sha }}

            Inspect only the pull-request diff and repository context needed to assess correctness, regressions, security/privacy, infrastructure neutrality, tests, migration/upgrade implications, and release-note consistency. Do not request or expose secrets or PII. Do not modify code, approve/merge the PR, change repository settings, or create a release.

            Return ONLY one compact JSON object and no markdown/code fences. The object MUST have exactly these keys:
            {"verdict":"PASS|BLOCK","head_sha":"40-hex SHA","base_sha":"40-hex SHA","findings":["concise finding"]}

            verdict MUST be PASS only if no release-blocking finding remains. Otherwise return BLOCK. Echo the exact head_sha and base_sha above unchanged.

      - name: Validate Gemini verdict
        if: always()
        shell: bash
        env:
          GEMINI_OUTCOME: ${{ steps.gemini_review.outcome }}
          GEMINI_ERRORS: ${{ steps.gemini_review.outputs.gemini_errors }}
          GEMINI_RESPONSE: ${{ steps.gemini_review.outputs.gemini_response }}
          EXPECTED_HEAD_SHA: ${{ steps.identity.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ steps.identity.outputs.base_sha }}
        run: |
          set -euo pipefail

          if [[ "${GEMINI_OUTCOME}" != "success" ]]; then
            echo '::error title=Gemini review UNKNOWN/BLOCK::Provider/action failure, timeout, quota error, or another execution failure occurred.'
            if [[ -n "${GEMINI_ERRORS}" ]]; then
              printf '%s\n' "${GEMINI_ERRORS}" | head -c 2000 >> "${GITHUB_STEP_SUMMARY}"
            fi
            exit 1
          fi

          if ! jq -e '
            type == "object" and
            (keys | sort) == ["base_sha","findings","head_sha","verdict"] and
            (.verdict == "PASS" or .verdict == "BLOCK") and
            (.head_sha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.base_sha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.findings | type == "array") and
            all(.findings[]; type == "string" and length <= 500)
          ' <<<"${GEMINI_RESPONSE}" >/dev/null; then
            echo '::error title=Gemini review UNKNOWN/BLOCK::Malformed or ambiguous Gemini response.'
            exit 1
          fi

          verdict="$(jq -r '.verdict' <<<"${GEMINI_RESPONSE}")"
          head_sha="$(jq -r '.head_sha' <<<"${GEMINI_RESPONSE}")"
          base_sha="$(jq -r '.base_sha' <<<"${GEMINI_RESPONSE}")"

          if [[ "${head_sha}" != "${EXPECTED_HEAD_SHA}" || "${base_sha}" != "${EXPECTED_BASE_SHA}" ]]; then
            echo '::error title=Gemini review UNKNOWN/BLOCK::Reviewed evidence does not match the exact current head/base SHA.'
            exit 1
          fi

          {
            echo '### Gemini exact-SHA verdict'
            echo "- verdict: **${verdict}**"
            echo "- head: \`${head_sha}\`"
            echo "- base: \`${base_sha}\`"
            echo '- findings:'
            jq -r '.findings[] | "  - " + .' <<<"${GEMINI_RESPONSE}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${verdict}" != "PASS" ]]; then
            echo '::error title=Gemini review BLOCK::Gemini reported one or more release-blocking findings.'
            exit 1
          fi
