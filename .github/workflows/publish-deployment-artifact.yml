name: Publish qualified deployment artifact

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag to promote
        required: true
        type: string
      confirmation:
        description: Type PROMOTE to publish the deployment artifact
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: home-center-deployment-artifact-${{ github.repository }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dispatch context
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve promotion request
        id: release
        shell: bash
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          [[ "$CONFIRMATION" == PROMOTE ]] || { echo 'confirmation must be PROMOTE' >&2; exit 64; }
          release_tag="$REQUESTED_RELEASE_TAG"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'release_tag must be vMAJOR.MINOR.PATCH' >&2; exit 64; }
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout exact stable release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: ""

      - name: Install release qualification dependencies
        run: python -m pip install 'pytest>=8,<9' 'jsonschema>=4.23,<5'

      - name: Verify stable release and exact source identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          tag_commit=$(git rev-list -n1 "$RELEASE_TAG")
          [[ "$tag_commit" == "$(git rev-parse HEAD)" ]] || { echo 'checked-out revision does not match tag' >&2; exit 66; }
          release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")
          python3 - "$RELEASE_TAG" "$release_json" <<'PY'
          import json, re, sys
          tag, raw = sys.argv[1:]
          data = json.loads(raw)
          if data.get('tag_name') != tag or data.get('draft') is not False or data.get('prerelease') is not False:
              raise SystemExit('release_not_stable')
          if re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag) is None:
              raise SystemExit('invalid_tag')
          PY

      - name: Check existing immutable deployment assets
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          version=${RELEASE_TAG#v}
          artifact_name="home-center-${version}-linux-amd64.tar.gz"
          sidecar_name="${artifact_name}.sha256"
          existing=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          artifact_present=0
          sidecar_present=0
          grep -Fxq "$artifact_name" <<<"$existing" && artifact_present=1 || true
          grep -Fxq "$sidecar_name" <<<"$existing" && sidecar_present=1 || true
          if (( artifact_present == 1 && sidecar_present == 1 )); then
            echo 'already_published=true' >> "$GITHUB_OUTPUT"
            echo "deployment assets already published for ${RELEASE_TAG}; idempotent success"
          elif (( artifact_present == 0 && sidecar_present == 0 )); then
            echo 'already_published=false' >> "$GITHUB_OUTPUT"
          else
            echo 'partial deployment asset set detected; refusing mutation' >&2
            exit 66
          fi

      - name: Run release qualification tests
        if: steps.existing.outputs.already_published != 'true'
        shell: bash
        env:
          PYTHONPATH: product/control-plane/src
        run: |
          set -Eeuo pipefail
          python -m compileall -q product/control-plane/src deploy/runtime
          python -m unittest discover -s tests -p 'test_*.py' -v
          for script in deploy/scripts/*.sh; do bash -n "$script"; done

      - name: Restore clean exact-tag worktree
        if: steps.existing.outputs.already_published != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git reset --hard HEAD
          git clean -ffdx
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'release worktree remains dirty after cleanup' >&2; exit 66; }

      - name: Build deployment artifact
        if: steps.existing.outputs.already_published != 'true'
        shell: bash
        env:
          HOME_CENTER_RELEASE_BUILD: "1"
        run: |
          set -Eeuo pipefail
          bash deploy/scripts/build-deployment-artifact.sh "$RUNNER_TEMP/deployment-dist"

      - name: Validate artifact privacy and content
        if: steps.existing.outputs.already_published != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          version=${RELEASE_TAG#v}
          artifact="$RUNNER_TEMP/deployment-dist/home-center-${version}-linux-amd64.tar.gz"
          sidecar="$artifact.sha256"
          [[ -f "$artifact" && -f "$sidecar" ]]
          (cd "$RUNNER_TEMP/deployment-dist" && sha256sum -c "$(basename "$sidecar")")
          members=$(tar -tzf "$artifact")
          for entry in ./DEPLOYMENT-ARTIFACT.json ./VERSION ./REVISION ./MANIFEST.sha256 ./deploy/bootstrap-two-node.sh ./deploy/install-node.sh ./deploy/rollback-node.sh; do
            grep -Fxq "$entry" <<<"$members" || { echo "missing required entry: $entry" >&2; exit 66; }
          done
          if grep -Eq 'current-environment|private-overlays|production-overlays' <<<"$members"; then
            echo 'environment-specific path found in deployment artifact' >&2
            exit 66
          fi

      - name: Recheck duplicate deployment assets before publish
        if: steps.existing.outputs.already_published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          version=${RELEASE_TAG#v}
          artifact_name="home-center-${version}-linux-amd64.tar.gz"
          sidecar_name="${artifact_name}.sha256"
          existing=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if grep -Fxq "$artifact_name" <<<"$existing" || grep -Fxq "$sidecar_name" <<<"$existing"; then
            echo 'deployment asset appeared during qualification; refusing replacement' >&2
            exit 66
          fi

      - name: Publish immutable deployment assets
        if: steps.existing.outputs.already_published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          version=${RELEASE_TAG#v}
          artifact="$RUNNER_TEMP/deployment-dist/home-center-${version}-linux-amd64.tar.gz"
          gh release upload "$RELEASE_TAG" "$artifact" "$artifact.sha256" --repo "$GITHUB_REPOSITORY"
