name: HC 0.22 compatibility fixtures

on:
  push:
    branches:
      - fix/hc-022-main-compat

permissions:
  contents: write

jobs:
  integrate-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout compatibility branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Align legacy endpoint fixtures and certificate invariant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- tests/test_automation_execution.py tests/test_node_inventory_api.py
          sed -i '/            "items": items,/a\            "production_mutation_enabled": False,' product/control-plane/src/home_center/certificate_api.py
          python -c 'import json; from pathlib import Path; p=Path("contracts/certificates/certificate-inventory.v1.schema.json"); d=json.loads(p.read_text(encoding="utf-8")); r=d["required"]; r.append("production_mutation_enabled") if "production_mutation_enabled" not in r else None; d["properties"]["production_mutation_enabled"]={"const":False}; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")'
          git rm .github/workflows/hc-022-test-fixture-compat.yml
          git add -A
          git commit -m "HC 0.22: align endpoint fixtures with first-login gate"
          git push origin HEAD:fix/hc-022-main-compat
