name: Publish official release

on:
  workflow_run:
    workflows:
      - Home Center CI
    types:
      - completed
    branches:
      - main
      - 'release/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: official-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    name: Evaluate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Evaluate release authorization
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="docs/releases/${version}.md"
          test -f "$notes"

          publishable=false
          if grep -Eq '^Status: official release\.?$' "$notes"; then
            if grep -Eiq 'qualification candidate|ready for qualification|development candidate|source-development package' "$notes"; then
              echo "Official release notes still contain candidate-only wording" >&2
              exit 1
            fi
            publishable=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "publishable=$publishable" >> "$GITHUB_OUTPUT"

          if [[ "$publishable" == true ]]; then
            echo "RELEASE_AUTHORIZATION=OFFICIAL version=${version}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "RELEASE_AUTHORIZATION=DEVELOPMENT_NO_PUBLISH version=${version}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report development release state
        if: steps.release.outputs.publishable != 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "RELEASE_STATE=DEVELOPMENT_NO_PUBLISH version=${RELEASE_VERSION} sha=${RELEASE_SHA}"
          echo "No tag, GitHub Release, deployment artifact, or Stable promotion is authorized for this development revision."

      - name: Publish or repair metadata idempotently
        if: steps.release.outputs.publishable == 'true'
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          guarded_tag_delta() {
            local tag_sha="$1"
            [[ -n "$tag_sha" ]] || return 1
            [[ "$tag_sha" == "$RELEASE_SHA" ]] && return 0
            git fetch --no-tags origin "$tag_sha" "$RELEASE_SHA"
            git merge-base --is-ancestor "$tag_sha" "$RELEASE_SHA" || return 1
            unexpected="$(git diff --name-only "$tag_sha" "$RELEASE_SHA" -- | grep -Ev "^(docs/releases/${RELEASE_VERSION}\.md|\.github/workflows/publish-release\.yml|\.github/workflows/publish-deployment-artifact\.yml)$" || true)"
            if [[ -n "$unexpected" ]]; then
              echo "POST_RELEASE_PRODUCT_DELTA_DETECTED"
              printf '%s\n' "$unexpected"
              return 2
            fi
            echo "Keeping immutable product tag ${RELEASE_TAG} at ${tag_sha}; only guarded release metadata/automation changed"
            return 0
          }

          release_exists=false
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            release_exists=true
          fi

          tag_sha=""
          if existing_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null)"; then
            tag_sha="$existing_tag_sha"
          fi

          if [[ "$release_exists" == true ]]; then
            if [[ -z "$tag_sha" ]]; then
              echo "Existing release ${RELEASE_TAG} has no matching Git tag" >&2
              exit 1
            fi

            set +e
            guarded_tag_delta "$tag_sha"
            guard_status=$?
            set -e
            if (( guard_status == 2 )); then
              echo "POST_RELEASE_DEVELOPMENT_SKIP: ${RELEASE_TAG} remains immutable while source contains newer product development"
              echo "promote=false" >> "$GITHUB_OUTPUT"
              echo "RELEASE_STATE=ALREADY_PUBLISHED_WITH_NEWER_SOURCE version=${RELEASE_VERSION}" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if (( guard_status != 0 )); then
              echo "Existing tag ${RELEASE_TAG} is incompatible with current release SHA ${RELEASE_SHA}" >&2
              exit 1
            fi

            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Home Center ${RELEASE_VERSION}" \
              --notes-file "$RELEASE_NOTES"
          else
            if [[ -n "$tag_sha" ]]; then
              set +e
              guarded_tag_delta "$tag_sha"
              guard_status=$?
              set -e
              if (( guard_status != 0 )); then
                echo "${RELEASE_TAG} already points to ${tag_sha}, incompatible with ${RELEASE_SHA}" >&2
                exit 1
              fi
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/tags/${RELEASE_TAG}" \
                -f sha="$RELEASE_SHA" >/dev/null
              tag_sha="$RELEASE_SHA"
            fi

            git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            [[ "$(git rev-list -n1 "$RELEASE_TAG")" == "$tag_sha" ]]

            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Home Center ${RELEASE_VERSION}" \
              --notes-file "$RELEASE_NOTES" \
              --verify-tag
          fi

          actual_title="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.name')"
          actual_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.tag_name')"
          actual_body="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.body')"
          expected_body="$(cat "$RELEASE_NOTES")"

          [[ "$actual_title" == "Home Center ${RELEASE_VERSION}" ]]
          [[ "$actual_tag" == "$RELEASE_TAG" ]]
          [[ "$actual_body" == "$expected_body" ]]
          echo "promote=true" >> "$GITHUB_OUTPUT"
          echo "RELEASE_STATE=PUBLISHED_OR_REPAIRED version=${RELEASE_VERSION} sha=${RELEASE_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dispatch deployment artifact publication
        if: steps.release.outputs.publishable == 'true' && steps.publish.outputs.promote == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run publish-deployment-artifact.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f release_tag="$RELEASE_TAG" \
            -f confirmation=PROMOTE
