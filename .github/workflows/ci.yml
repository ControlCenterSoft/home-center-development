name: Home Center CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q product/control-plane/src deploy/runtime
      - name: Validate JSON contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("contracts").rglob("*.json")):
              with path.open(encoding="utf-8") as stream:
                  json.load(stream)
          for path in sorted(Path("product/control-plane/src/home_center").glob("*.json")):
              with path.open(encoding="utf-8") as stream:
                  json.load(stream)
          print("JSON_CONTRACTS=PASS")
          PY
      - name: Run unit tests and import every module
        env:
          PYTHONPATH: product/control-plane/src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
