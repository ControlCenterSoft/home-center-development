name: Home Center CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}
      - name: Establish exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo EXACT_HEAD_MISMATCH >&2; exit 66; }
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo SOURCE_TREE_DIRTY >&2; exit 66; }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9' 'jsonschema>=4.23,<5'
      - name: Compile source
        run: python -m compileall -q product/control-plane/src deploy/runtime
      - name: Validate JSON contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("contracts").rglob("*.json")):
              with path.open(encoding="utf-8") as stream:
                  json.load(stream)
          for path in sorted(Path("product/control-plane/src/home_center").glob("*.json")):
              with path.open(encoding="utf-8") as stream:
                  json.load(stream)
          print("JSON_CONTRACTS=PASS")
          PY
      - name: Set reproducible artifact timestamp
        run: git log -1 --format=SOURCE_DATE_EPOCH=%ct >> "$GITHUB_ENV"
      - name: Build and qualify release artifact
        run: |
          mkdir -p dist/first dist/second
          python -m pip wheel --no-deps --wheel-dir dist/first .
          python -m pip wheel --no-deps --wheel-dir dist/second .
          python scripts/qualify_release_artifact.py \
            --wheel-dir dist/first \
            --compare-wheel-dir dist/second
      - name: Run complete test suite and import every module
        env:
          PYTHONPATH: product/control-plane/src
        run: python -m pytest -q
